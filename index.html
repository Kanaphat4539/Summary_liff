<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Log History | LoadAlert</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main Style -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loader">
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <div class="loader-core"></div>
        </div>
        <div class="loading-text">CONNECTING TO DATABASE...</div>
    </div>

    <div id="app" class="app-container hidden">
        
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="header-icon">📋</div>
                <div class="header-titles">
                    <h1>HISTORY LOG</h1>
                    <span>ประวัติงานซ่อมทั้งหมด</span>
                </div>
            </div>
            <div class="header-right">
                <button id="btn-refresh" class="btn-icon" onclick="refreshData()">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                </button>
            </div>
        </header>

        <!-- Filters Section -->
        <div class="filter-section">
            <div class="filter-grid">
                <div class="filter-group">
                    <label>ค้นหา (Search)</label>
                    <input type="text" id="search-input" placeholder="เลขเคส, เครื่องจักร, ช่าง...">
                </div>
                <div class="filter-group">
                    <label>วันที่ (Date)</label>
                    <input type="date" id="filter-date">
                </div>
                <div class="filter-group">
                    <label>เดือน (Month)</label>
                    <input type="month" id="filter-month">
                </div>
                <div class="filter-group">
                    <label>ปี (Year)</label>
                    <select id="filter-year">
                        <option value="">ทั้งหมด (All)</option>
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                    </select>
                </div>
            </div>
            <div class="filter-actions">
                <button class="btn btn-outline" onclick="clearFilters()">ล้างตัวกรอง</button>
                <button class="btn btn-primary" onclick="applyFilters()">กรองข้อมูล</button>
            </div>
        </div>

        <!-- Summary Banner -->
        <div class="summary-banner">
            <div>พบข้อมูล: <strong id="record-count" style="color:var(--c-cyan);">0</strong> รายการ</div>
            <div><span class="status-dot success"></span> อัปเดต: <span id="last-update">--:--</span></div>
        </div>

        <!-- Table Wrapper (Horizontal Scroll) -->
        <div class="table-wrapper">
            <table class="log-table" id="log-table">
                <thead>
                    <tr>
                        <th class="sticky-col">Case ID</th>
                        <th>วันที่ / เวลา</th>
                        <th>Machine</th>
                        <th>SP No</th>
                        <th>ช่างซ่อม</th>
                        <th>Downtime</th>
                        <th>Loss Cost</th>
                        <th>สถานะ</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Rows will be injected here via JS -->
                </tbody>
            </table>
            <!-- Empty State -->
            <div id="empty-state" class="empty-state hidden">
                <div class="empty-icon">📭</div>
                <div>ไม่พบข้อมูลที่ตรงกับเงื่อนไข</div>
            </div>
        </div>
        
    </div>

    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="script.js"></script>
</body>
</html>
